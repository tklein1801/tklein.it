platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: 24-alpine

inputs:
  - name: repository

params:
  CI: true
  FORCE_COLOR: 1
  NEXT_TELEMETRY_DISABLED: 1
  NPM_CONFIG_LOGLEVEL: 'error'
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_UPDATE_NOTIFIER: false

run:
  path: sh
  args:
    - -exc
    - |
      cd repository/
      npm install
      npm audit fix --force
      npm run lint
      npm run test
      npm run build
      git add package*.json
      git commit -m 'build(dependencies): Automated update of dependencies'
