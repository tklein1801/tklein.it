groups:
  - name: all
    jobs:
      - '*'
  - name: build
    jobs:
      - build
  - name: deploy
    jobs:
      - deploy*

resource_types:
  - name: cogito
    type: registry-image
    check_every: 24h
    source:
      repository: pix4d/cogito
  - name: github-pr
    type: registry-image
    check_every: 24h
    source:
      repository: teliaoss/github-pr-resource
      tag: latest
  - name: ssh-scp
    type: registry-image
    source:
      repository: ghcr.io/tklein1801/concourse-ssh-scp-resource

resources:
  - name: server-target
    type: ssh-scp
    icon: server
    check_every: never
    source:
      user: ((deployment-vps1.ssh_username))
      host: ((deployment-vps1.host))
      known_hosts: |
        ((deployment-vps1.known_hosts))
      private_key: |
        ((deployment-vps1.ssh_private_key))
  - name: repository
    type: git
    icon: git
    source:
      uri: git@github.com:((repo.owner))/((repo.name)).git
      branch: main
      private_key: ((github.private_key))
  - name: ci-source
    type: git
    icon: git
    source:
      uri: git@github.com:((ci.source.owner))/((ci.source.name)).git
      branch: ((ci.source.branch))
      private_key: ((github.private_key))
      paths: [ci/**]
  - name: pr-((repo.pr.branch))
    type: github-pr
    check_every: 1m
    icon: github
    source:
      repository: ((repo.owner))/((repo.name))
      access_token: ((github.pat))
      base_branch: ((repo.pr.branch))
      disable_ci_skip: true
  - name: container-registry
    type: docker-image
    icon: docker
    source:
      repository: ghcr.io/((repo.owner))/((repo.name))
      username: ((docker.username))
      password: ((docker.password))
  - name: status
    type: cogito
    icon: github
    check_every: never
    source:
      owner: ((repo.owner))
      repo: ((repo.name))
      access_token: ((github.pat))
  - name: timer
    type: time
    icon: clock-outline
    source:
      interval: 168h

jobs:
  - name: build
    serial: true
    public: true
    on_success:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: success}
    on_failure:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: failure}
    on_error:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: error}
    on_abort:
      put: status
      inputs: [repository]
      no_get: true
      params: {state: abort}
    plan:
      - in_parallel:
          - get: repository
            trigger: true
          - get: ci-source
      - put: status
        inputs: [repository]
        params: {state: pending}
        no_get: true
      - task: verify
        file: ci-source/ci/tasks/verify.task.yml
        input_mapping: {source: repository}
      - put: container-registry
        get_params: {skip_download: true}
        params:
          build: repository
          dockerfile: repository/Dockerfile
          tag_file: repository/.git/short_ref
          tag_as_latest: true
  - name: deploy
    serial: true
    plan:
      - in_parallel:
          - get: repository
            passed: [build]
          - get: container-registry
            passed: [build]
            params: {skip_download: true}
          - get: ci-source
      - task: deploy
        file: ci-source/ci/tasks/deploy.task.yml
        params:
          DEPLOY_PATH: ((deployment.path))
          REGISTRY_USERNAME: ((docker.username))
          REGISTRY_PASSWORD: ((docker.password))
      - load_var: deploy-image
        file: deploy-files/image-ref
        format: trim
      - put: server-target
        inputs: []
        no_get: true
        params:
          commands:
            - "mkdir -p -- '((deployment.path))' && umask 077 && mkdir -- '((deployment.path))/.registry-credentials'"
      - do:
          - put: server-target
            inputs: [deploy-files, registry-credentials]
            no_get: true
            params:
              files:
                'deploy-files/compose.next.yml': '((deployment.path))/compose.next.yml'
                'deploy-files/deploy.next.sh': '((deployment.path))/deploy.next.sh'
                'registry-credentials/username': '((deployment.path))/.registry-credentials/username'
                'registry-credentials/password': '((deployment.path))/.registry-credentials/password'
              commands:
                - "sh '((deployment.path))/deploy.next.sh' '((deployment.path))' '((.:deploy-image))'"
        ensure:
          put: server-target
          inputs: []
          no_get: true
          params:
            commands:
              - "rm -f -- '((deployment.path))/.registry-credentials/username' '((deployment.path))/.registry-credentials/password' && if [ -d '((deployment.path))/.registry-credentials' ]; then rmdir -- '((deployment.path))/.registry-credentials'; fi"
  - name: pull-request
    public: true
    on_success:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: success
    on_failure:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: failure
    on_error:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: error
    on_abort:
      put: pr-((repo.pr.branch))
      params:
        path: pr-((repo.pr.branch))
        status: error
    plan:
      - in_parallel:
          - get: pr-((repo.pr.branch))
            trigger: true
            version: every
          - get: ci-source
      - put: pr-((repo.pr.branch))
        params:
          path: pr-((repo.pr.branch))
          status: pending
      - task: verify
        file: ci-source/ci/tasks/verify.task.yml
        input_mapping:
          repository: pr-((repo.pr.branch))
      - put: pr-((repo.pr.branch))
        params:
          path: pr-((repo.pr.branch))
          status: success
  - name: update-dependencies
    public: true
    plan:
      - in_parallel:
          - get: repository
          - get: ci-source
          - get: timer
            trigger: true
      - task: npm-update
        file: ci-source/ci/tasks/update-dependencies.task.yml
        params:
          GIT_NAME: ((git.name))
          GIT_EMAIL: ((git.email))
      - put: repository
        params:
          repository: repository
          rebase: true
